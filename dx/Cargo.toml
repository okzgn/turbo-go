[workspace]
resolver = "2"
members = ["dx-core", "dx-lua"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

# Without panic = "abort": an error that a function of Rust gives a script (a wrong argument of turbox, the time that
# is over) crosses frames of Rust on its way to Lua, and would end the worker with it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
